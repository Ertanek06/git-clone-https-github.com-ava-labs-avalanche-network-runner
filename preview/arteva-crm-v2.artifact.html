
<title>ARTEVA CRM v2.0</title>
<style>
/* ===========================================================================
   ARTEVA DESIGN SYSTEM v2.0
   Tek iskelet kuralı:
     1 token katmanı · 1 buton · 1 input · 1 tablo · 1 kart · 1 sayfa başlığı
     1 panel (her açılım sağdan dikey) · 1 tipografi ölçeği
   Hiçbir ekran kendi stilini yazmaz; hepsi aşağıdaki bileşenleri kullanır.
   =========================================================================== */
:root{
  /* renk */
  --brand:#e11d2a; --brand-600:#c8152260; --brand-700:#a91019; --brand-50:#fdecee;
  --bg:#f4f6f9; --surface:#fff; --surface-2:#f8fafc; --surface-3:#f1f4f8;
  --line:#e6eaf0; --line-2:#d7dee7;
  --ink:#1a2235; --ink-2:#48536a; --ink-3:#7b869a;
  --ok:#12a150; --ok-50:#e8f7ee; --warn:#b45309; --warn-50:#fff4e0;
  --info:#2563eb; --info-50:#e9f0ff; --dim:#eef1f5;
  /* ölçek */
  --fs-2xs:10px; --fs-xs:11px; --fs-sm:12px; --fs-md:13px; --fs-lg:15px; --fs-xl:20px; --fs-2xl:24px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px;
  --r-sm:6px; --r-md:8px; --r-lg:12px; --r-pill:999px;
  --h-xs:26px; --h-sm:30px; --h-md:34px; --h-lg:40px;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
  --shadow-lg:0 12px 34px rgba(16,24,40,.16);
  --sb-w:224px; --tb-h:56px;
  --font:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  /* sidebar tokenları ana temadan bağımsız */
  --sb-bg:#fff; --sb-ink:#333e52; --sb-ink-2:#8b95a7; --sb-hover:#f3f5f8; --sb-group:#98a2b3; --sb-line:var(--line);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
  --bg:#0f141c; --surface:#161c26; --surface-2:#1b222e; --surface-3:#212a37;
  --line:#273040; --line-2:#333e51; --ink:#e7ecf4; --ink-2:#b6c1d2; --ink-3:#8d99ad;
  --dim:#222b39; --brand-50:#3a1720; --ok-50:#123021; --warn-50:#332612; --info-50:#17233d;
  --shadow:0 1px 3px rgba(0,0,0,.45); --shadow-lg:0 14px 38px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0f141c; --surface:#161c26; --surface-2:#1b222e; --surface-3:#212a37;
  --line:#273040; --line-2:#333e51; --ink:#e7ecf4; --ink-2:#b6c1d2; --ink-3:#8d99ad;
  --dim:#222b39; --brand-50:#3a1720; --ok-50:#123021; --warn-50:#332612; --info-50:#17233d;
  --shadow:0 1px 3px rgba(0,0,0,.45); --shadow-lg:0 14px 38px rgba(0,0,0,.55);
}
body.t-dark{
  --bg:#0f141c; --surface:#161c26; --surface-2:#1b222e; --surface-3:#212a37;
  --line:#273040; --line-2:#333e51; --ink:#e7ecf4; --ink-2:#b6c1d2; --ink-3:#8d99ad;
  --dim:#222b39; --brand-50:#3a1720; --ok-50:#123021; --warn-50:#332612; --info-50:#17233d;
  --shadow:0 1px 3px rgba(0,0,0,.45); --shadow-lg:0 14px 38px rgba(0,0,0,.55);
}
body.sb-dark{ --sb-bg:#141a24; --sb-ink:#d7dee9; --sb-ink-2:#8794a8; --sb-hover:#1e2632; --sb-group:#6f7d92; --sb-line:#222b38; }

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:var(--fs-md);line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:var(--r-pill)}
::-webkit-scrollbar-track{background:transparent}

/* ---------- 1) TİPOGRAFİ ---------- */
.h1{font-size:var(--fs-2xl);font-weight:700;letter-spacing:-.02em;margin:0;color:var(--ink)}
.h2{font-size:var(--fs-lg);font-weight:650;margin:0;color:var(--ink)}
.h3{font-size:var(--fs-md);font-weight:650;margin:0;color:var(--ink)}
.sub{font-size:var(--fs-md);color:var(--ink-3);margin:0}
.meta{font-size:var(--fs-sm);color:var(--ink-3)}
.num{font-variant-numeric:tabular-nums}

/* ---------- 2) KONTROL TABANI — tıklanabilir her şey buradan türer ---------- */
.ctl{font-family:inherit;cursor:pointer;border:1px solid transparent;background:none;color:inherit;
  border-radius:var(--r-sm);transition:background .14s,border-color .14s,color .14s}
.ctl:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.ctl:active{transform:translateY(.5px)}

/* ---------- BUTON — tek aksiyon bileşeni ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);
  height:var(--h-md);padding:0 var(--sp-3);border-radius:var(--r-md);
  border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
  font-family:inherit;font-size:var(--fs-sm);font-weight:600;line-height:1;cursor:pointer;
  transition:background .14s,border-color .14s,color .14s;white-space:nowrap
}
.btn:hover{background:var(--surface-3);color:var(--ink);border-color:var(--line-2)}
.btn:active{transform:translateY(.5px)}
.btn:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.btn--primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn--primary:hover{background:var(--brand-700);border-color:var(--brand-700);color:#fff}
.btn--ghost{background:transparent;border-color:transparent;color:var(--ink-3)}
.btn--ghost:hover{background:var(--surface-3);color:var(--ink)}
.btn--danger{color:var(--brand);border-color:var(--line)}
.btn--danger:hover{background:var(--brand-50);border-color:var(--brand);color:var(--brand)}
.btn--icon{width:var(--h-md);padding:0}
.btn--lg{height:var(--h-lg);padding:0 var(--sp-4);font-size:var(--fs-md)}
.btn--sm{height:var(--h-sm);padding:0 var(--sp-2);font-size:var(--fs-xs)}
.btn--sm.btn--icon{width:var(--h-sm)}
.btn--xs{height:var(--h-xs);padding:0 var(--sp-2);font-size:var(--fs-2xs)}
.btn--xs.btn--icon{width:var(--h-xs)}
.btn--on{background:var(--brand);border-color:var(--brand);color:#fff}
.btn__badge{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;border-radius:var(--r-pill);
  background:var(--brand);color:#fff;font-size:var(--fs-2xs);font-weight:700;display:grid;place-items:center;
  padding:0 4px;border:2px solid var(--surface)}
.btn--rel{position:relative;overflow:visible}
.btn-group{display:inline-flex;gap:var(--sp-2);flex-wrap:wrap}

/* ---------- 3) INPUT — tek bileşen ---------- */
.inp{
  width:100%;height:var(--h-md);border:1px solid var(--line);border-radius:var(--r-md);
  background:var(--surface);color:var(--ink);padding:0 var(--sp-3);
  font-family:inherit;font-size:var(--fs-sm);outline:none;transition:border-color .14s,box-shadow .14s
}
.inp::placeholder{color:var(--ink-3)}
.inp:hover{border-color:var(--line-2)}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-50)}
textarea.inp{height:auto;padding:var(--sp-2) var(--sp-3);resize:vertical;line-height:1.4}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
  background-position:calc(100% - 15px) 14px,calc(100% - 10px) 14px;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.inp--flush{border-color:transparent;background:transparent;height:auto;padding:var(--sp-1) var(--sp-2);font-size:var(--fs-sm)}
.inp--flush:hover{border-color:var(--line)}
.inp--flush:focus{background:var(--surface)}
.inp--num{text-align:right;font-variant-numeric:tabular-nums}
.inp--sm{height:var(--h-sm);font-size:var(--fs-xs)}
.field{display:grid;gap:var(--sp-1);min-width:0}
.field>span{font-size:var(--fs-xs);font-weight:650;color:var(--ink-3);letter-spacing:.01em}
.field--wide{grid-column:1/-1}
.form{display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:var(--sp-3)}
@media(max-width:760px){.form{grid-template-columns:minmax(0,1fr)}}

/* ---------- 4) KART ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);min-width:0}
.card__h{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--line)}
.card__h--plain{border-bottom:0;padding-bottom:0}
.card__h .spacer{flex:1}
.card__b{padding:var(--sp-4)}
.card__b--flush{padding:0}

/* ---------- 5) SAYFA BAŞLIĞI ---------- */
.page{display:grid;gap:var(--sp-4)}
.page__h{display:flex;align-items:flex-start;gap:var(--sp-4);flex-wrap:wrap}
.page__h .spacer{flex:1}
.page__acts{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap}

/* ---------- 6) TOOLBAR ---------- */
.toolbar{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap}
.toolbar .grow{flex:1;min-width:200px;max-width:340px}
.toolbar .spacer{flex:1}

/* ---------- 7) TABLO — tek motor ---------- */
.dt-wrap{overflow-x:auto}
.dt{width:100%;border-collapse:separate;border-spacing:0}
.dt th{
  text-align:left;font-size:var(--fs-xs);font-weight:650;color:var(--ink-3);letter-spacing:.02em;
  padding:var(--sp-3) var(--sp-3);background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap;
  position:sticky;top:0;z-index:1
}
.dt td{padding:var(--sp-3);border-bottom:1px solid var(--line);font-size:var(--fs-sm);vertical-align:middle;color:var(--ink-2)}
.dt tbody tr:last-child td{border-bottom:0}
.dt tbody tr:hover td{background:var(--surface-2)}
.dt .t-right{text-align:right}
.dt .t-center{text-align:center}
.dt .t-strong{color:var(--ink);font-weight:650}
.dt .t-num{font-variant-numeric:tabular-nums;text-align:right;color:var(--ink);font-weight:600}
.dt__empty{padding:var(--sp-6);text-align:center;color:var(--ink-3);font-size:var(--fs-md)}
.dt__acts{display:flex;gap:var(--sp-1);justify-content:flex-end}

/* ---------- 8) ROZET / PILL ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:var(--r-pill);
  font-size:var(--fs-xs);font-weight:650;white-space:nowrap;background:var(--dim);color:var(--ink-3)}
.pill--info{background:var(--info-50);color:var(--info)}
.pill--warn{background:var(--warn-50);color:var(--warn)}
.pill--brand{background:var(--brand-50);color:var(--brand)}
.pill--ok{background:var(--ok-50);color:var(--ok)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}

/* ---------- 9) MEDYA KUTUSU ---------- */
.thumb{width:38px;height:38px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface-2);
  display:grid;place-items:center;font-size:16px;flex:none;overflow:hidden}
.thumb--sm{width:30px;height:30px;font-size:13px}
.cell{display:flex;align-items:center;gap:var(--sp-3);min-width:0}
.cell b{display:block;font-size:var(--fs-sm);font-weight:650;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell small{display:block;font-size:var(--fs-xs);color:var(--ink-3)}

/* ---------- 10) SHELL ---------- */
html,body{height:100%}
.shell{display:flex;min-height:100%}
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--sb-w);background:var(--sb-bg);border-right:1px solid var(--sb-line);
  display:flex;flex-direction:column;z-index:40;transition:width .2s ease}
.main{margin-left:var(--sb-w);flex:1;min-width:0;display:flex;flex-direction:column;transition:margin .2s ease}
body.sb-min{--sb-w:64px}
body.sb-min .sb-t,body.sb-min .sb-group,body.sb-min .sb-chev,body.sb-min .org,body.sb-min .brand b,body.sb-min .brand small{display:none}
body.sb-min .sb-item{justify-content:center;padding:var(--sp-2) 0}
.brand{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-4) var(--sp-4) var(--sp-3)}
.brand .mark{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;
  font-weight:800;font-size:15px;flex:none;box-shadow:0 2px 8px rgba(225,29,42,.35)}
.brand b{display:block;font-size:var(--fs-lg);letter-spacing:.06em;color:var(--brand);font-weight:800;line-height:1.05}
.brand small{display:block;font-size:8.5px;color:var(--sb-ink-2);white-space:nowrap}
.org{position:relative;margin:0 var(--sp-3) var(--sp-3);border-radius:var(--r-md);overflow:hidden;height:54px;
  background:linear-gradient(135deg,#2c3e55,#4c6480);display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-2) var(--sp-3);color:#fff}
.org::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.07) 0 8px,transparent 8px 18px)}
.org>*{position:relative;z-index:1}
.org .mark{width:26px;height:26px;border-radius:var(--r-sm);background:rgba(255,255,255,.92);color:#2c3e55;
  display:grid;place-items:center;font-weight:800;font-size:var(--fs-xs);flex:none}
.org b{display:block;font-size:var(--fs-xs);letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.org small{display:block;font-size:9.5px;opacity:.85}
.sb-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 var(--sp-2) var(--sp-2)}
.sb-group{padding:var(--sp-3) var(--sp-2) var(--sp-1);font-size:var(--fs-2xs);font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--sb-group)}
.sb-item{display:flex;align-items:center;gap:var(--sp-2);width:100%;color:var(--sb-ink);
  padding:7px var(--sp-2);border-radius:var(--r-sm);font-family:inherit;font-size:var(--fs-sm);font-weight:500;
  text-align:left;margin-bottom:1px}
.sb-item:hover{background:var(--sb-hover)}
.sb-item.on{background:var(--brand);color:#fff;font-weight:650}
.sb-i{width:16px;flex:none;display:grid;place-items:center;font-size:14px;opacity:.8}
.sb-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-chev{font-size:9px;opacity:.4}
.sb-foot{border-top:1px solid var(--sb-line);padding:var(--sp-2)}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;height:var(--tb-h);background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:var(--sp-3);padding:0 var(--sp-4)}
.search{flex:1;max-width:400px;position:relative}
.search .inp{padding-left:32px;padding-right:56px;background:var(--surface-2)}
.search .ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-size:var(--fs-sm)}
.search kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-family:inherit;font-size:var(--fs-2xs);
  color:var(--ink-3);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:2px 5px}
.tb-r{margin-left:auto;display:flex;align-items:center;gap:var(--sp-2)}
.who{display:flex;align-items:center;gap:var(--sp-2);padding:3px 6px 3px 3px;border-radius:var(--r-md)}
.who:hover{background:var(--surface-3)}
.who .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#3f5876,#6b829e);color:#fff;
  display:grid;place-items:center;font-size:var(--fs-xs);font-weight:700;flex:none}
.who b{display:block;font-size:var(--fs-sm);font-weight:650;line-height:1.15;text-align:left}
.who small{display:block;font-size:var(--fs-xs);color:var(--ink-3);line-height:1.15;text-align:left}
.content{padding:var(--sp-5)}
.foot{display:flex;gap:var(--sp-3);padding:var(--sp-4) var(--sp-5);border-top:1px solid var(--line);
  color:var(--ink-3);font-size:var(--fs-xs);flex-wrap:wrap}
.foot .spacer{flex:1}

/* ---------- 11) PANEL — tek açılım biçimi, daima sağdan dikey ---------- */
.scrim{position:fixed;inset:0;background:rgba(9,18,33,.45);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.panel{position:fixed;inset:0 0 0 auto;width:min(520px,96vw);background:var(--surface);border-left:1px solid var(--line);
  z-index:61;transform:translateX(102%);transition:transform .24s cubic-bezier(.2,.8,.2,1);
  display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.panel.on{transform:none}
.panel--wide{width:min(760px,96vw)}
.panel__h{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-4);border-bottom:1px solid var(--line)}
.panel__h .spacer{flex:1}
.panel__b{flex:1;overflow:auto;padding:var(--sp-4);display:grid;gap:var(--sp-4);align-content:start}
.panel__f{padding:var(--sp-3) var(--sp-4);border-top:1px solid var(--line);display:flex;gap:var(--sp-2);
  justify-content:flex-end;flex-wrap:wrap;align-items:center}
.note{display:flex;gap:var(--sp-2);padding:var(--sp-3);border-radius:var(--r-md);font-size:var(--fs-sm);
  background:var(--warn-50);color:var(--warn);border:1px solid rgba(180,83,9,.2)}
.note--info{background:var(--info-50);color:var(--info);border-color:rgba(37,99,235,.2)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);background:#101828;color:#fff;
  padding:var(--sp-3) var(--sp-4);border-radius:var(--r-md);font-size:var(--fs-sm);z-index:90;opacity:0;
  pointer-events:none;transition:.2s;box-shadow:var(--shadow-lg)}
.toast.on{opacity:1;transform:translateX(-50%)}

/* ---------- 12) DASHBOARD ---------- */
.dash{display:grid;grid-template-columns:minmax(0,1fr) 252px;gap:var(--sp-4);align-items:start}
@media(max-width:1360px){.dash{grid-template-columns:minmax(0,1fr)}.rail{display:none}}
.zone{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--sp-4);align-content:start}
.w{grid-column:span 12}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--sp-3)}
@media(max-width:1000px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{display:flex;align-items:flex-start;gap:var(--sp-3);padding:var(--sp-4);background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-lg)}
.kpi>div{flex:1;min-width:0}
.kpi .t{font-size:var(--fs-sm);color:var(--ink-3);margin-bottom:6px}
.kpi .v{font-size:var(--fs-2xl);font-weight:700;color:var(--ink);letter-spacing:-.025em;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .d{margin-top:7px;font-size:var(--fs-xs);color:var(--ok);font-weight:650}
.kpi .d.flat{color:var(--ink-3);font-weight:500}
.kpi .i{width:36px;height:36px;border-radius:var(--r-md);display:grid;place-items:center;font-size:16px;flex:none;
  background:var(--brand-50);color:var(--brand)}
.legend{display:flex;gap:var(--sp-4);font-size:var(--fs-xs);color:var(--ink-3)}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px}
.donut{display:flex;align-items:center;gap:var(--sp-4)}
.donut__l{flex:1;display:grid;gap:6px;font-size:var(--fs-sm);color:var(--ink-2)}
.donut__l div{display:flex;align-items:center;gap:7px}
.donut__l b{margin-left:auto;color:var(--ink);font-weight:650;font-variant-numeric:tabular-nums}
.hbars{display:grid;gap:9px;font-size:var(--fs-sm);color:var(--ink-2)}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) 88px 18px;align-items:center;gap:9px}
.hbar__t{height:8px;border-radius:var(--r-pill);background:var(--dim);overflow:hidden}
.hbar__f{height:100%;border-radius:var(--r-pill);background:#f2a3a9}
.hbar b{text-align:right;color:var(--ink);font-weight:650;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:var(--sp-5);padding:0 var(--sp-4);border-bottom:1px solid var(--line);align-items:center}
.tab{border-radius:0;padding:12px 0 10px;font-size:var(--fs-md);color:var(--ink-3);
  font-weight:500;border-width:0 0 2px;border-bottom-color:transparent}
.tab.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:650}
.quads{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--sp-3)}
@media(max-width:900px){.quads{grid-template-columns:repeat(2,minmax(0,1fr))}}

<script>
/* ===========================================================================
   Tek iskelet: her ekran aşağıdaki UI bileşenlerini kullanır, kendi stilini yazmaz.
   =========================================================================== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>'id'+Math.random().toString(36).slice(2,9);
const money=n=>Number(n||0).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2});
const money0=n=>Number(n||0).toLocaleString('tr-TR',{maximumFractionDigits:0});
const store={get(k,d){try{const v=localStorage.getItem('arteva2:'+k);return v?JSON.parse(v):d}catch{return d}},
  set(k,v){try{localStorage.setItem('arteva2:'+k,JSON.stringify(v))}catch{}},del(k){try{localStorage.removeItem('arteva2:'+k)}catch{}}};

/* ---------------- UI bileşenleri (tek kaynak) ---------------- */
const UI = {
  btn:({t='',i='',v='',s='',id='',go='',act='',title='',on=false})=>
    `<button class="ctl btn${v?' btn--'+v:''}${s?' btn--'+s:''}${on?' btn--on':''}"${id?` id="${id}"`:''}${go?` data-go="${go}"`:''}${act?` data-act="${act}"`:''}${title?` title="${esc(title)}"`:''}>${i}${i&&t?' ':''}${esc(t)}</button>`,
  iconBtn:(i,{s='sm',v='ghost',act='',title='',id=''}={})=>
    `<button class="ctl btn btn--${v} btn--icon${s?' btn--'+s:''}"${id?` id="${id}"`:''}${act?` data-act="${act}"`:''} title="${esc(title)}">${i}</button>`,
  field:({label,name='',type='text',value='',ph='',opts=null,wide=false,rows=0,attrs=''})=>{
    const cls='inp'+(type==='number'?' inp--num':'');
    const ctl = opts ? `<select class="${cls}" data-f="${name}" ${attrs}>${opts.map(o=>{
        const [v,l]=Array.isArray(o)?o:[o,o]; return `<option value="${esc(v)}"${String(value)===String(v)?' selected':''}>${esc(l)}</option>`}).join('')}</select>`
      : rows ? `<textarea class="${cls}" rows="${rows}" data-f="${name}" placeholder="${esc(ph)}" ${attrs}>${esc(value)}</textarea>`
      : `<input class="${cls}" type="${type}" data-f="${name}" value="${esc(value)}" placeholder="${esc(ph)}" ${attrs}>`;
    return `<label class="field${wide?' field--wide':''}"><span>${esc(label)}</span>${ctl}</label>`;
  },
  card:({title='',acts='',body='',flush=false,plain=false})=>
    `<section class="card">${title||acts?`<div class="card__h${plain?' card__h--plain':''}"><h3 class="h3">${esc(title)}</h3><span class="spacer"></span>${acts}</div>`:''}
      <div class="card__b${flush?' card__b--flush':''}">${body}</div></section>`,
  page:({title,sub='',acts=''})=>
    `<div class="page__h"><div><h1 class="h1">${esc(title)}</h1>${sub?`<p class="sub">${esc(sub)}</p>`:''}</div>
      <span class="spacer"></span><div class="page__acts">${acts}</div></div>`,
  table:({cols,rows,empty='Kayıt bulunamadı.'})=>{
    const head=cols.map(c=>`<th${c.w?` style="width:${c.w}"`:''}${c.align?` class="t-${c.align}"`:''}>${esc(c.t||'')}</th>`).join('');
    const body = rows.length ? rows.map((r,i)=>`<tr data-i="${i}">${cols.map(c=>{
        const cls = c.cls || (c.align?`t-${c.align}`:'');
        return `<td${cls?` class="${cls}"`:''}>${c.render? c.render(r,i) : esc(r[c.k]??'')}</td>`;
      }).join('')}</tr>`).join('')
      : `<tr><td colspan="${cols.length}"><div class="dt__empty">${esc(empty)}</div></td></tr>`;
    return `<div class="dt-wrap"><table class="dt"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
  },
  pill:(label,kind='')=>`<span class="pill${kind?' pill--'+kind:''}">${esc(label)}</span>`,
  thumb:(g,sm=false)=>`<span class="thumb${sm?' thumb--sm':''}">${g||'🖼'}</span>`,
  toolbar:html=>`<div class="toolbar">${html}</div>`,
  search:(id,ph='Ara...')=>`<span class="grow"><input class="inp" id="${id}" placeholder="${esc(ph)}"></span>`
};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2200)}

/* ---------------- Panel: TEK açılım biçimi (sağdan dikey) ---------------- */
const Panel = {
  open({title,body,foot='',wide=false}){
    $('#pTitle').textContent=title; $('#pBody').innerHTML=body; $('#pFoot').innerHTML=foot;
    $('#panel').classList.toggle('panel--wide',!!wide);
    $('#panel').classList.add('on'); $('#panel').setAttribute('aria-hidden','false'); $('#scrim').classList.add('on');
  },
  close(){ $('#panel').classList.remove('on'); $('#panel').setAttribute('aria-hidden','true'); $('#scrim').classList.remove('on'); }
};
$('#pClose').onclick=Panel.close;
$('#scrim').onclick=()=>{Panel.close();closeMega();document.body.classList.remove('sb-open')};
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){Panel.close();closeMega();} });

function paintNav(active){
  const open=store.get('navOpen',{});
  $('#nav').innerHTML=NAV_DEF.map(sec=>{
    const items=sec.items.filter(it=>!navCfg.hide[it.k]);
    if(!items.length) return '';
    return (sec.g?`<div class="sb-group">${sec.g}</div>`:'')+items.map(it=>{
      const kids=(it.ch||[]).filter(c=>!navCfg.hide[c[0]]);
      const mode=itemMode(it), isOpen=open[it.k]&&mode==='acc';
      const hasKids=kids.length&&mode!=='flat';
      const on=it.k===active||kids.some(c=>c[0]===active);
      const head=`<button class="ctl sb-item${on?' on':''}" ${hasKids?`data-node="${it.k}" data-mode="${mode}"`:`data-go="${it.k}"`}>
        <span class="sb-i">${itemIcon(it)}</span><span class="sb-t">${esc(itemLabel(it))}</span>
        ${hasKids?`<span class="sb-chev">❯</span>`:''}</button>`;
      if(!hasKids) return head;
      return `<div class="sb-node${isOpen?' open':''}" data-node-wrap="${it.k}">${head}
        <div class="sb-sub">${kids.map(c=>`<button class="ctl sb-item${c[0]===active?' on':''}" data-go="${c[0]}">
          <span class="sb-t">${esc(c[1])}</span></button>`).join('')}</div></div>`;
    }).join('');
  }).join('');
  $$('#nav [data-node]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.node;
    if(b.dataset.mode==='mega') return openMega(k);
    const wrap=b.closest('[data-node-wrap]'); const now=!wrap.classList.contains('open');
    wrap.classList.toggle('open',now);
    const o=store.get('navOpen',{}); o[k]=now; store.set('navOpen',o);
  });
}
function openMega(k){
  const it=allItems().find(x=>x.k===k); if(!it) return;
  const kids=(it.ch||[]).filter(c=>!navCfg.hide[c[0]]);
  $('#mega').innerHTML=`<div class="card__h card__h--plain" style="padding:0">
      <h3 class="h2">${itemIcon(it)} ${esc(itemLabel(it))}</h3><span class="spacer"></span>
      <button class="ctl btn btn--ghost btn--icon" data-mega-close title="Kapat">×</button></div>
    <div class="mega__grid">${kids.map(c=>`<button class="ctl mega__item" data-go="${c[0]}">
      <span class="thumb thumb--sm">${itemIcon(it)}</span><span style="min-width:0"><b style="display:block;font-size:var(--fs-sm);font-weight:650;color:var(--ink)">${esc(c[1])}</b>
      <small style="font-size:var(--fs-xs);color:var(--ink-3)">${esc(itemLabel(it))}</small></span></button>`).join('')}</div>`;
  $('#mega').classList.add('on'); $('#scrim').classList.add('on');

}

function listPage({title,sub,newLabel,onNew,filters='',cols,getRows,empty,bulk=true,onRow}){
  const acts=(newLabel?UI.btn({t:newLabel,i:'＋',v:'primary',id:'pNew'}):'')+UI.btn({t:'Excel',i:'⇩'});
  render(UI.page({title,sub,acts}) + UI.card({flush:true,
    body:`<div class="card__b">${UI.toolbar(UI.search('lq','Ara...')+filters+'<span class="spacer"></span>'+UI.btn({t:'Filtreler',i:'⚙',s:'sm'}))}</div>
      <div class="bulk" id="lBulk" hidden><span id="lBulkN">0 kayıt seçildi</span><span class="spacer" style="flex:1"></span>
        ${UI.btn({t:'Excel’e aktar',i:'⇩',s:'sm'})}${UI.btn({t:'Arşivle',i:'🗄',s:'sm',v:'danger'})}</div>
      <div id="lTable"></div>`}));
  const full=cols=>bulk?[{t:'',w:'34px',cls:'chk',render:()=>'<input type="checkbox" data-row-chk>'},...cols]:cols;
  const paint=()=>{
    const rows=getRows($('#lq').value.trim().toLowerCase(),$('#lf')?.value||'');
    $('#lTable').innerHTML=UI.table({cols:full(cols),rows,empty});
    // MASTER: satırın kendisi ön izlemedir; alan ve düğmeler kendi işini görür.
    $$('#lTable tbody tr').forEach(tr=>{
      const r=rows[+tr.dataset.i]; if(!r) return;
      if(onRow){ tr.classList.add('prev'); tr.title='Ön izleme';
        tr.onclick=ev=>{ if(ev.target.closest('input,button,select,textarea,a')) return; onRow(r); }; }
    });
    $$('#lTable [data-act]').forEach(b=>b.onclick=ev=>{ ev.stopPropagation();
      (cols.find(c=>c.onAct)?.onAct||(()=>{}))(b.dataset.act,rows[+b.closest('tr').dataset.i]); });
    $$('#lTable [data-prev]').forEach(b=>b.onclick=ev=>{ ev.stopPropagation();
      PREV[b.dataset.prev](rows[+b.closest('tr').dataset.i]); });
    const sync=()=>{ const n=$$('#lTable [data-row-chk]:checked').length;
      $('#lBulk').hidden=!n; $('#lBulkN').textContent=`${n} kayıt seçildi`; };
    $$('#lTable [data-row-chk]').forEach(c=>c.onchange=sync);
    sync();
  };
  $('#lq').oninput=paint; if($('#lf'))$('#lf').onchange=paint;
  if(onNew)$('#pNew').onclick=()=>onNew(paint);
  paint(); return paint;
}

function toggleEdit(){
  edit=!edit; document.body.classList.toggle('edit',edit);
  $('#bar').innerHTML = edit ? `<div class="card"><div class="card__b"><div class="toolbar">
      <b class="h3">🧩 Dashboard Düzenle</b><span class="meta">Aç/kapat · sürükleyerek taşı · genişliği değiştir</span>
      <span class="spacer"></span>
      ${Object.entries(W).map(([k,v])=>UI.btn({t:v.t,s:'sm',act:'tg:'+k,on:!!layout.find(x=>x.k===k)?.on})).join('')}
      ${UI.btn({t:'Varsayılan',i:'↺',s:'sm',act:'reset'})}${UI.btn({t:'Düzeni Kaydet',i:'💾',v:'primary',s:'sm',act:'save'})}
    </div></div></div>` : '';
  $$('#bar [data-act]').forEach(b=>b.onclick=()=>{
    const a=b.dataset.act;
    if(a==='save'){store.set('layout',layout);return toast('Dashboard düzeni kaydedildi.');}
    if(a==='reset'){layout=JSON.parse(JSON.stringify(DEF));store.del('layout');}
    if(a.startsWith('tg:')){const k=a.slice(3);const it=layout.find(x=>x.k===k);it?it.on=!it.on:layout.push({k,w:W[k].span,on:true});}
    paintZone(); edit=!edit; toggleEdit();
  });
  paintZone();
}
function paintZone(){
  const z=$('#zone'); if(!z) return;
  z.innerHTML = layout.filter(x=>x.on&&W[x.k]).map(x=>
    `<div class="w" data-w="${x.k}" draggable="${edit}" style="grid-column:span ${x.w}">${W[x.k].r(x)}</div>`).join('');
  $$('#zone .w').forEach(el=>{
    el.addEventListener('dragstart',e=>{if(!edit)return;el.classList.add('drag');e.dataTransfer.setData('text/plain',el.dataset.w)});
    el.addEventListener('dragend',()=>el.classList.remove('drag'));
    el.addEventListener('dragover',e=>{if(!edit)return;e.preventDefault();el.classList.add('over')});
    el.addEventListener('dragleave',()=>el.classList.remove('over'));
    el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('over');
      const f=e.dataTransfer.getData('text/plain'),t=el.dataset.w; if(!f||f===t)return;
      const fi=layout.findIndex(x=>x.k===f),ti=layout.findIndex(x=>x.k===t);
      layout.splice(ti,0,layout.splice(fi,1)[0]); paintZone();});
    $$('[data-act]',el).forEach(b=>b.onclick=ev=>{
      ev.stopPropagation(); const it=layout.find(x=>x.k===el.dataset.w); if(!it)return;
      if(b.dataset.act==='off')it.on=false;
      if(b.dataset.act==='wide')it.w=Math.min(12,it.w+2);
      if(b.dataset.act==='narrow')it.w=Math.max(3,it.w-2);
      paintZone(); if(edit){edit=!edit;toggleEdit();}
    });
  });
}

      {t:'İsk %',w:'86px',render:(l,i)=>`<input class="inp inp--flush inp--num" type="number" min="0" max="100" step="0.01" value="${(+l.dPct).toFixed(2)}" data-f="dPct" data-i="${i}">`},
      {t:'İsk Tutar',w:'112px',render:(l,i)=>`<input class="inp inp--flush inp--num" type="number" min="0" step="0.01" value="${(+l.dAmt).toFixed(2)}" data-f="dAmt" data-i="${i}">`},
      {t:'KDV',w:'78px',render:(l,i)=>`<input class="inp inp--flush inp--num" type="number" min="0" step="1" value="${l.vat}" data-f="vat" data-i="${i}">`},
      {t:'Satır Toplamı',w:'116px',align:'right',cls:'t-num',render:l=>`<div style="padding-top:7px">${money(calc(l).n)} ${cur}</div>`},
      {t:'İşlemler',w:'196px',align:'right',render:(l,i)=>`<div class="dt__acts" style="padding-top:4px">
        ${UI.iconBtn('✎',{s:'xs',v:'',act:'edit',title:'Ürünü / satırı düzenle'})}
        ${UI.iconBtn('🔄',{s:'xs',v:'',act:'alt',title:'Muadil ürün ekle'})}
        ${l.alt?UI.iconBtn('⊘',{s:'xs',v:'',act:'unalt',title:'Muadil işaretini kaldır'}):''}
        ${UI.iconBtn('⧉',{s:'xs',v:'',act:'copy',title:'Satırı kopyala'})}
        ${UI.iconBtn('↑',{s:'xs',v:'',act:'up',title:'Yukarı'})}
        ${UI.iconBtn('↓',{s:'xs',v:'',act:'down',title:'Aşağı'})}
        ${UI.iconBtn('🗑',{s:'xs',v:'',act:'del',title:'Sil'})}</div>`}
    ],
    rows:PF.lines, empty:'Satır yok. “Boş Satır” veya “Ürün Seç” ile ekleyin.'
  });
  $$('#pfL tbody tr').forEach((tr,i)=>{
    if(PF.lines[i]?.alt) tr.classList.add('alt');
    // Satırın üzerine tıklamak ürün düzenleme panelini açar; alan ve düğmeler kendi işini yapar.
    tr.addEventListener('click',ev=>{
      if(ev.target.closest('input,select,textarea,button,.grip')) return;
      panelLine(i);
    });
    tr.draggable=true;
    tr.addEventListener('dragstart',e=>{tr.classList.add('drag');e.dataTransfer.setData('text/plain',i)});
    tr.addEventListener('dragend',()=>tr.classList.remove('drag'));
    tr.addEventListener('dragover',e=>{e.preventDefault();tr.classList.add('over')});
    tr.addEventListener('dragleave',()=>tr.classList.remove('over'));
    tr.addEventListener('drop',e=>{e.preventDefault();tr.classList.remove('over');
      const f=+e.dataTransfer.getData('text/plain'); if(f===i)return;
      PF.lines.splice(i,0,PF.lines.splice(f,1)[0]); paintLines()});
  });
  $$('#pfL [data-f]').forEach(el=>{
    // Yazarken tablo yeniden kurulmaz; yalnızca türeyen hücreler tazelenir.
    // Böylece imleç kaybolmaz ve DOM baştan yazılmaz.
    const h=()=>{
      const i=+el.dataset.i, l=PF.lines[i], f=el.dataset.f, g=+l.qty*+l.price;
      if(f==='dPct'){l.dType='P';l.dPct=+el.value||0;l.dAmt=g*l.dPct/100;setPair(i,'dAmt',l.dAmt)}
      else if(f==='dAmt'){l.dType='A';l.dAmt=+el.value||0;l.dPct=g?l.dAmt/g*100:0;setPair(i,'dPct',l.dPct)}
      else l[f]=['qty','price','vat'].includes(f)?(+el.value||0):el.value;
      if(['qty','price'].includes(f)){
        const n=+l.qty*+l.price;
        if(l.dType==='P'){l.dAmt=n*(+l.dPct)/100;setPair(i,'dAmt',l.dAmt)}
        else{l.dPct=n?(+l.dAmt)/n*100:0;setPair(i,'dPct',l.dPct)}
      }
      const cell=$(`#pfL tbody tr[data-i="${i}"] td.t-num`);
      if(cell) cell.innerHTML=`<div style="padding-top:7px">${money(calc(l).n)} ${PF.cur}</div>`;
      paintTot();
    };
    el.oninput=h; el.onchange=h;
  });
  $$('#pfL [data-act]').forEach(b=>b.onclick=()=>{
    const i=+b.closest('tr').dataset.i,a=b.dataset.act;
    if(a==='edit')return panelLine(i);
    if(a==='del')PF.lines.splice(i,1);
    if(a==='copy')PF.lines.splice(i+1,0,{...PF.lines[i],id:uid()});
    if(a==='up'&&i>0)PF.lines.splice(i-1,0,PF.lines.splice(i,1)[0]);
    if(a==='down'&&i<PF.lines.length-1)PF.lines.splice(i+1,0,PF.lines.splice(i,1)[0]);
    if(a==='unalt')PF.lines[i].alt=false;
    if(a==='alt')return panelPicker(p=>{
      PF.lines.splice(i+1,0,{...line(),code:p.code,name:p.name,img:p.img,unit:p.unit,price:p.price,vat:p.vat,alt:true});
      paintLines(); toast('Muadil ürün eklendi (toplamlara dahil değil).')});
    paintLines();
  });
  paintTot();
}
// Eşlenik iskonto alanını, kullanıcı o alanda yazarken ezmeden günceller.
function setPair(i,f,v){
  const el=$(`#pfL [data-f="${f}"][data-i="${i}"]`);
  if(el && document.activeElement!==el) el.value=Number(v).toFixed(2);
}
function paintTot(){const t=tot(),c=PF.cur;
  $('#pfT').innerHTML=`<div><span>Ara Toplam</span><b>${money(t.s)} ${c}</b></div>
    <div><span>Toplam İskonto</span><b style="color:var(--brand)">− ${money(t.d)} ${c}</b></div>
    <div><span>Net Tutar</span><b>${money(t.n)} ${c}</b></div>
    <div><span>KDV</span><b>${money(t.v)} ${c}</b></div>
    <div class="g"><span>Genel Toplam</span><b>${money(t.g)} ${c}</b></div>
    <p class="meta">Muadil satırlar toplamlara dahil edilmez.</p>`}
function paintCat(q){
  const rows=DB.products.filter(p=>!q||(p.code+p.name+p.cat).toLowerCase().includes(q.toLowerCase()));
  $('#pfCat').innerHTML=rows.map(p=>`<button class="ctl pick" data-p="${p.id}">${UI.thumb(p.img,true)}
    <span style="flex:1;min-width:0"><b style="display:block;font-size:var(--fs-sm);font-weight:650;color:var(--ink)">${esc(p.name)}</b>
    <small style="font-size:var(--fs-xs);color:var(--ink-3)">${p.code} · ₺${money0(p.price)} · ${p.unit}</small></span>
    <span style="color:var(--brand);font-weight:700">＋</span></button>`).join('')||'<p class="meta">Sonuç yok.</p>';
  $$('#pfCat [data-p]').forEach(b=>b.onclick=()=>{addLine(DB.products.find(p=>p.id===b.dataset.p));toast('Ürün satıra eklendi.')});
}

function panelCustomer(rec,done){
  Panel.open({title:rec?'Müşteriyi Düzenle':'Yeni Müşteri',
    body:`<div id="dup"></div>`+UI.card({title:'Firma Bilgileri',body:`<div class="form">
      ${UI.field({label:'Firma Adı',name:'name',value:rec?.name||'',wide:true,ph:'Örn. ASELSAN'})}
      ${UI.field({label:'Yetkili',name:'contact',value:rec?.contact||''})}
      ${UI.field({label:'Şehir',name:'city',value:rec?.city||''})}
      ${UI.field({label:'Telefon',name:'phone',value:rec?.phone||''})}
      ${UI.field({label:'E-posta',name:'email',value:rec?.email||''})}
      ${UI.field({label:'Vergi No',name:'tax',value:rec?.tax||'',wide:true})}</div>`}),
    foot:UI.btn({t:'Vazgeç',act:'close'})+UI.btn({t:rec?'Güncelle':'Kaydet ve Bağla',v:'primary',act:'save'})});
  const get=n=>$(`#pBody [data-f="${n}"]`).value.trim();
  $('#pBody [data-f="name"]').oninput=e=>{
    const v=e.target.value.trim().toLowerCase();
    const hit=v.length>2&&DB.customers.find(c=>c.id!==rec?.id&&(c.name.toLowerCase().includes(v)||v.includes(c.name.toLowerCase())));
    $('#dup').innerHTML=hit?`<div class="note">⚠ Benzer kayıt bulundu: <b>${esc(hit.name)}</b> (${hit.code}). Mükerrer kayıt olabilir.</div>`:'';
  };
  $('#pFoot [data-act="close"]').onclick=Panel.close;
  $('#pFoot [data-act="save"]').onclick=()=>{
    const name=get('name'); if(!name) return toast('Firma adı zorunlu.');
    if(rec){ Object.assign(rec,{name,contact:get('contact'),city:get('city'),phone:get('phone'),email:get('email'),tax:get('tax')}); }
    else { rec={id:uid(),code:'M-'+String(DB.customers.length+1).padStart(4,'0'),name,contact:get('contact'),
      city:get('city'),phone:get('phone'),email:get('email'),tax:get('tax')}; DB.customers.push(rec); }
    save('customers'); Panel.close(); toast('Müşteri kaydedildi.'); done&&done(rec);
  };
}

/* ---------------- Proforma satırı / ürün düzenleme ----------------
   MASTER akışının aynısı: görsel, kod, GTİP, menşei, ad, fiyat, para birimi,
   birim, KDV, açıklama, broşür / CE / kullanma kılavuzu. Kayıtlı ürün burada
   düzenlenirse ana ürün kaydı da güncellenir; yalnız bu proformaya özel
   bırakmak isteyen “Sadece bu proformada” seçer. ---------------- */
function panelLine(i){
  const l=PF.lines[i]; if(!l) return;
  const fileRow=(lab,key,accept,val)=>`<div class="field"><span>${lab}</span>
    <div class="file"><label class="ctl file__btn">⬆ Dosya seç<input type="file" accept="${accept}" data-file="${key}" hidden></label>
      <span class="file__name" data-fname="${key}">${esc(val||'Seçili dosya yok')}</span>
      <input class="inp inp--sm" data-f="${key}Url" value="${esc(l[key+'Url']||'')}" placeholder="veya URL yapıştır"></div></div>`;
  Panel.open({wide:true,title:'Ürün / Satır Düzenle',
    body:`<div class="note note--info">Kayıtlı ürün burada düzenlenirse ana ürün kaydı da güncellenir.
        Satır üzerinde doğrudan yapılan değişiklikler yalnızca bu proformaya özel kalır.</div>
      ${UI.card({title:'Ürün Görseli',body:`<div class="media">
        <span class="media__box" id="lnImg">${l.imgUrl?`<img src="${esc(l.imgUrl)}" alt="">`:(l.img||'🖼')}</span>
        <div class="file"><label class="ctl file__btn">⬆ Görsel yükle<input type="file" accept="image/png,image/jpeg,image/webp" id="lnImgFile" hidden></label>
          <input class="inp inp--sm" data-f="imgUrl" value="${esc(l.imgUrl||'')}" placeholder="Görsel URL">
          <input class="inp inp--sm" data-f="img" value="${esc(l.img||'')}" placeholder="veya sembol / emoji" maxlength="4"></div></div>`})}
      ${UI.card({title:'Ürün Bilgileri',body:`<div class="form" style="--cols:2">
        ${UI.field({label:'Ürün Kodu',name:'code',value:l.code})}
        ${UI.field({label:'GTİP Numarası',name:'gtip',value:l.gtip})}
        ${UI.field({label:'Menşei',name:'origin',value:l.origin})}
        ${UI.field({label:'Birim',name:'unit',value:l.unit,opts:UNITS})}
        ${UI.field({label:'Ürün Adı',name:'name',value:l.name,wide:true})}
        ${UI.field({label:'Birim Fiyat',name:'price',type:'number',value:l.price})}
        ${UI.field({label:'Para Birimi',name:'cur',value:l.cur||PF.cur,opts:['TRY','EUR','USD']})}
        ${UI.field({label:'KDV %',name:'vat',type:'number',value:l.vat})}
        ${UI.field({label:'Miktar',name:'qty',type:'number',value:l.qty})}
        ${UI.field({label:'Ürün Açıklaması (teklife özel)',name:'desc',value:l.desc,rows:4,wide:true})}</div>`})}
      ${UI.card({title:'Belgeler',body:`<div class="form" style="--cols:1">
        ${fileRow('Broşür (PDF)','brochure','application/pdf',l.brochure)}
        ${fileRow('CE Belgesi (PDF)','ce','application/pdf',l.ce)}
        ${fileRow('Kullanma Kılavuzu (PDF)','manual','application/pdf',l.manual)}</div>`})}
      ${UI.card({title:'Teklifte Görünüm',body:`<div class="navedit">
        ${[['showImg','Görseli teklifte göster'],['showDesc','Açıklamayı teklifte göster'],['inTotal','Toplamlara dahil et']]
          .map(([k,t])=>`<div class="navedit__row" style="grid-template-columns:auto minmax(0,1fr)">
            <button class="ctl switch" data-sw="${k}" aria-pressed="${l[k]?'true':'false'}"></button>
            <span>${t}</span></div>`).join('')}</div>`})}`,
    foot:`<div class="seg" style="margin-right:auto">
        <button class="ctl" data-scope="line" aria-pressed="true">Sadece bu proformada</button>
        <button class="ctl" data-scope="master" aria-pressed="false">Ürün kaydını da güncelle</button></div>
      ${UI.btn({t:'Vazgeç',act:'close'})}${UI.btn({t:'Kaydet',v:'primary',act:'save'})}`});

  let scope='line';
  $$('#pFoot [data-scope]').forEach(b=>b.onclick=()=>{
    scope=b.dataset.scope;
    $$('#pFoot [data-scope]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
  });
  const sw={showImg:l.showImg,showDesc:l.showDesc,inTotal:l.inTotal};
  $$('#pBody [data-sw]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.sw; sw[k]=sw[k]?0:1; b.setAttribute('aria-pressed',String(!!sw[k]));
  });
  // Yüklenen dosya tarayıcıda okunur; görsel anında önizlenir.
  $('#lnImgFile').onchange=e=>{
    const f=e.target.files?.[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{ $('#pBody [data-f="imgUrl"]').value=r.result; $('#lnImg').innerHTML=`<img src="${r.result}" alt="">`; };
    r.readAsDataURL(f);
  };
  $$('#pBody [data-file]').forEach(inp=>inp.onchange=e=>{
    const f=e.target.files?.[0]; if(!f) return;
    $(`#pBody [data-fname="${inp.dataset.file}"]`).textContent=f.name;
    inp.dataset.picked=f.name;
  });
  const get=n=>$(`#pBody [data-f="${n}"]`)?.value ?? '';
  $('#pFoot [data-act="close"]').onclick=Panel.close;
  $('#pFoot [data-act="save"]').onclick=()=>{
    Object.assign(l,{code:get('code'),gtip:get('gtip'),origin:get('origin'),name:get('name'),
      desc:get('desc'),unit:get('unit'),cur:get('cur'),img:get('img'),imgUrl:get('imgUrl'),
      price:+get('price')||0,vat:+get('vat')||0,qty:+get('qty')||0,
      brochureUrl:get('brochureUrl'),ceUrl:get('ceUrl'),manualUrl:get('manualUrl'),
      ...sw});
    $$('#pBody [data-file]').forEach(inp=>{ if(inp.dataset.picked) l[inp.dataset.file]=inp.dataset.picked; });
    const g=+l.qty*+l.price;
    l.dType==='P'?l.dAmt=g*(+l.dPct)/100:l.dPct=g?(+l.dAmt)/g*100:0;
    if(scope==='master'){
      const p=DB.products.find(x=>x.code===l.code);
      const rec={code:l.code,name:l.name,unit:l.unit,price:l.price,vat:l.vat,img:l.img||'📦',cat:p?.cat||'Genel'};
      p?Object.assign(p,rec):DB.products.push({id:uid(),stock:0,...rec});
      save('products'); toast('Satır ve ana ürün kaydı güncellendi.');
    } else toast('Satır bu proformaya özel güncellendi.');
    Panel.close(); paintLines();
  };
}

/* ---------------- Sidebar düzenleyici: gizle/göster, ikon, ad, açılma biçimi ---------------- */
function panelNavEdit(){

      <button class="ctl switch" data-tg="${key}" aria-pressed="${off?'false':'true'}" title="${off?'Gizli':'Görünür'}"></button>
      ${child?'<span></span>':`<button class="ctl btn btn--icon" data-ico="${it.k}" title="İkon seç">${itemIcon(it)}</button>`}
      <input class="inp inp--sm" data-lbl="${key}" value="${esc(navCfg.label[key]||label)}">
      ${child?'<span></span>':`<select class="inp inp--sm" data-mode="${it.k}">${NAV_MODES.map(m=>`<option value="${m[0]}"${itemMode(it)===m[0]?' selected':''}>${m[1]}</option>`).join('')}</select>`}
      <span class="meta">${child?'alt':'ana'}</span></div>`;
  };
  const body = NAV_DEF.map(sec=>(sec.g?`<div class="navedit__grp">${sec.g}</div>`:'')+
    sec.items.map(it=>row(it)+(it.ch||[]).map(c=>row(it,c)).join('')).join('')).join('');
  Panel.open({wide:true,title:'Menüyü Düzenle',
    body:`<div class="note note--info">Kapattığın menü sidebar'da görünmez. İkonu değiştirebilir, adını yeniden yazabilir, ana menünün akordiyon mu mega menü mü açılacağını seçebilirsin.</div>
      ${UI.card({title:'Menü Öğeleri',body:`<div class="navedit">${body}</div>`})}`,
    foot:UI.btn({t:'Varsayılana dön',i:'↺',act:'reset'})+UI.btn({t:'Kapat',act:'close'})});
  const refresh=()=>{ saveNav(); paintNav(route); };
  $$('#pBody [data-tg]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.tg, off=!navCfg.hide[k];
    off?navCfg.hide[k]=1:delete navCfg.hide[k];
    b.setAttribute('aria-pressed',String(!off)); b.closest('.navedit__row').dataset.off=off?'1':'0';
    refresh();
  });
  $$('#pBody [data-lbl]').forEach(i=>i.onchange=()=>{
    const k=i.dataset.lbl, v=i.value.trim();
    v?navCfg.label[k]=v:delete navCfg.label[k]; refresh();
  });
  $$('#pBody [data-mode]').forEach(sel=>sel.onchange=()=>{ navCfg.mode[sel.dataset.mode]=sel.value; refresh(); });
  $$('#pBody [data-ico]').forEach(b=>b.onclick=()=>panelIcon(b.dataset.ico,()=>panelNavEdit()));
  $('#pFoot [data-act="close"]').onclick=Panel.close;
  $('#pFoot [data-act="reset"]').onclick=()=>{ navCfg={hide:{},icon:{},label:{},mode:{}}; saveNav(); paintNav(route); panelNavEdit(); toast('Menü varsayılana döndü.'); };
}
// İkon / emoji seçici — hazır kütüphaneden seç ya da kendi sembolünü yaz.

      </div><p class="meta" style="margin:var(--sp-3) 0 var(--sp-2)">Hazır ikonlar</p>
      <div class="emoji-grid">${EMOJIS.map(e=>`<button class="ctl" data-e="${e}">${e}</button>`).join('')}</div>`}),
    foot:UI.btn({t:'Varsayılana dön',act:'def'})+UI.btn({t:'Uygula',v:'primary',act:'ok'})});
  const apply=v=>{ v?navCfg.icon[key]=v:delete navCfg.icon[key]; saveNav(); paintNav(route); Panel.close(); done&&done(); };
  $$('#pBody [data-e]').forEach(b=>b.onclick=()=>{ $('#icoIn').value=b.dataset.e; });
  $('#pFoot [data-act="ok"]').onclick=()=>apply($('#icoIn').value.trim());
  $('#pFoot [data-act="def"]').onclick=()=>apply('');
}

/* ---------------- Tema Stüdyosu ---------------- */
function pgTheme(){
  render(UI.page({title:'Tema Stüdyosu',sub:'Ana tema ve sidebar teması birbirinden bağımsız.'})
   + UI.card({title:'Görünüm',body:`<div class="form" style="--cols:3;max-width:680px">
      ${UI.field({label:'Ana Tema',name:'th',opts:[['light','Açık'],['dark','Koyu']],value:document.body.classList.contains('t-dark')?'dark':'light'})}
      ${UI.field({label:'Sidebar Teması',name:'sb',opts:[['light','Açık'],['dark','Koyu']],value:document.body.classList.contains('sb-dark')?'dark':'light'})}
      ${UI.field({label:'Ana Renk',name:'col',type:'color',value:store.get('brand','#e11d2a')})}
    </div><p class="meta" style="margin-top:var(--sp-3)">Tercihler tarayıcıda saklanır.</p>`}));
  $('[data-f="th"]').onchange=e=>{document.body.classList.toggle('t-dark',e.target.value==='dark');store.set('theme',e.target.value)};
  $('[data-f="sb"]').onchange=e=>{document.body.classList.toggle('sb-dark',e.target.value==='dark');store.set('sbTheme',e.target.value)};
  $('[data-f="col"]').oninput=e=>{document.documentElement.style.setProperty('--brand',e.target.value);store.set('brand',e.target.value)};
}

/* ---------------- boot ---------------- */
$('#navEdit').onclick=panelNavEdit;
$('#burger').onclick=()=>{
  // Dar ekranda menü çekmece gibi açılır, geniş ekranda raya daralır.
  if(matchMedia('(max-width:860px)').matches) document.body.classList.toggle('sb-open');
  else document.body.classList.toggle('sb-min');
};
// Perde ve menüden sayfa seçimi çekmeceyi kapatır.
$('#scrim').addEventListener('click',()=>document.body.classList.remove('sb-open'));
document.addEventListener('click',e=>{ if(e.target.closest('#nav [data-go],.sb-foot [data-go]')) document.body.classList.remove('sb-open'); });
$('#theme').onclick=()=>{const d=!document.body.classList.contains('t-dark');
  document.body.classList.toggle('t-dark',d);store.set('theme',d?'dark':'light')};
$('#new').onclick=()=>go('yeni-teklif');
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#q').focus()}});
if(store.get('theme')==='dark')document.body.classList.add('t-dark');
if(store.get('sbTheme')==='dark')document.body.classList.add('sb-dark');
if(store.get('brand'))document.documentElement.style.setProperty('--brand',store.get('brand'));
go('dashboard');
</script>
